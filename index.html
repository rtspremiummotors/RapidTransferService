<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0c1828" />

    <title>Rapid Transfer Service | Taxi & Airport Transfers Belgium</title>
    <meta
      name="description"
      content="Premium taxi and private transfers in Brussels and across Belgium. Airport transfers, business travel and international transfers to France, the Netherlands, Luxembourg and Germany. Book online, 24/7."
    />
    <link rel="canonical" href="https://rapidtransferservice.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph defaults (overridden per-page by react-helmet-async) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rapid Transfer Service" />
    <meta property="og:title" content="Rapid Transfer Service | Taxi & Airport Transfers Belgium" />
    <meta property="og:description" content="Premium taxi and private transfers in Brussels and across Belgium, plus airport, business and international transfers." />
    <meta property="og:url" content="https://rapidtransferservice.com/" />
    <meta property="og:image" content="https://rapidtransferservice.com/og-image.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rapid Transfer Service | Taxi & Airport Transfers Belgium" />
    <meta name="twitter:description" content="Premium taxi and private transfers in Brussels and across Belgium, plus airport, business and international transfers." />
    <meta name="twitter:image" content="https://rapidtransferservice.com/og-image.jpg" />

    <!-- Fonts: Outfit (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Static fallback for crawlers/scrapers that don't execute JavaScript -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Rapid Transfer Service",
        "url": "https://rapidtransferservice.com",
        "logo": "https://rapidtransferservice.com/logo-mark.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
